[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
google-genai = "^1.46.0"
pydantic = "^2.12.3"
streamlit = "^1.51.0"
pytest = "^8.4.2"
python-dotenv = "^1.2.1"
matplotlib = "^3.10.7"
google-cloud-aiplatform = {extras = ["evaluation"], version = "^1.124.0"}
pandas = "^2.3.3"
numpy = "^2.4.0"
google-adk = "^1.21.0"
requests = "^2.32.5"
google-auth = "^2.45.0"
tenacity = "^9.1.2"
pydub = "^0.25.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "src"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "quality: marks tests as quality tests (deselect with '-m \"not quality\"')",
    "stability: marks tests as stability tests (deselect with '-m \"not stability\"')",
]

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "playwright (>=1.55.0,<2.0.0)",
    "pytest-asyncio (>=0.23.7,<1.0.0)",
    "pytest-cov (>=5.0.0,<6.0.0)",
    "pylint (>=4.0.4,<5.0.0)"
]
